<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>table responsive</title>
</head>
<body>
  
  <div class="container">
    <h2>반응형 테이블 </h2>  
    
      <div class="table-responsive">
        <table>
          <caption>자료실 목록입니다. No, 제목, 조회수, 작성자 및 등록일로 구성되어 있습니다.</caption>
            <colgroup>
              <col style="width: 55px"><col><col style="width: 70px"><col style="width: 90px"><col style="width: 120px">
            </colgroup>
            <thead>
              <tr>
                <th scope="col">No</th><th scope="col">제목</th>
                <th scope="col">조회수</th>
                <th scope="col">작성자</th>
                <th scope="col">등록일</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td data-tit="No">2</td><td class="tal mb_block" data-tit="제목">
                  <a href="#none" class="hover_line"><span style="">본문 제목 본문 제목 본문 제목 본문 제목 본문 제목 본문 제목 본문 제목 본문 제목 </span> </a>
                </td>
                <td data-tit="작성자">관리자</td>
                <td data-tit="등록일">2025-11-20</td>
                <td data-tit="조회수">117</td>
              </tr>
              <tr>
                <td data-tit="No">1</td><td class="tal mb_block" data-tit="제목">
                  <a href="#none" class="hover_line"><span style="">본문 제목 본문 제목 본문 제목 본문 제목 본문 제목 본문 제목 본문 제목 본문 제목 </span> </a>
                </td>
                <td data-tit="작성자">관리자</td>
                <td data-tit="등록일">2025-11-20</td>
                <td data-tit="조회수">151</td>
              </tr>
            </tbody>
          </table>
      </div>
    
  </div>

  <style lang="scss" scoped >
    .tal { text-align: left !important;}
    .table-responsive { 
      width:100%; border-top: 2px solid #000; 
      position: relative; clear: both; overflow-x: auto;
      caption { display: none;}
      table {table-layout: fixed; border-collapse: collapse; 
        width: 100%; clear: both;
        border-top: 0px solid #111;
        thead {
          th {
            vertical-align: top;
            font-weight: 600;
            padding: 17px 0 16px;
            border-bottom: 1px solid #ddd;
            background-color: #f5f5f5;
          }
        } 
        tbody th, tbody td {
        padding: 17px 0 16px;
        min-height: 60px;
        /* *height: auto; */
        border-bottom: 1px solid #ddd;
        vertical-align: middle
        }
        tbody {
          th { vertical-align: top }
          td {
            text-align: center;
            vertical-align: middle;
            padding-left: 2px;
            padding-right: 2px
          }
          .btn-arr-toggle {
            font-weight: 600;
            font-size: inherit
          }
          @media (min-width: 1280px) {
            tr:hover th, tr:hover td {
              background-color: #fbfbfb;
            }
            tr:hover th {
            background-color: #fafafa;
            }
          } 
          td.mb_block  {
          }
          .hover_line {
            &:hover { border-bottom: 1px solid #111 }
            display: inline-block; max-width: 100%;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #111;
            vertical-align: middle;
            border-bottom: 1px solid transparent;
          }
        }

      }

      @media screen and (max-width: 1024px) {
        position: relative;
        thead { display: none }
        table {
          col, tbody td, thead th {
            display: inline-block; width: auto; 
            padding: 5px 0; height: auto; min-height: 0;
            text-align: left; line-height: 1.5;
            border: 0;
          }
          tbody {
            tr { display: block; width: 100%; padding: 10px 0;
              border-bottom: 1px solid #ccc;
            }
            td { margin-right: 20px;
              &::before {
                content: attr(data-tit) " : ";
                display: inline-block;
                margin-right: 5px; font-weight: 600; text-align: left;
              }
              &.mb_block { display: block; margin-right: 0; }
            }
          } 

        } 
      }
    }
  </style>
</body>
</html>
