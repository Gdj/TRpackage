    .form-responsive {

      .form-layout { display: flex; flex-wrap: wrap; margin-top: 0px;
        width: calc(100% + 20px); margin-left: -10px;   
        > *  { padding: 0 10px; }
        .form-item { position: relative; margin-top: 20px;
          em { color:#f00;}
          .form-other { position: absolute; top:0; right:0; }                             // other
          .form-label { display: inline-block; margin: 0 2px 5px; }                       // label
          .form-data  { height: 30px;                                         // data
            display: flex; flex-grow: 1; align-items: center;
            > * { flex-grow: 1; }
          }   
        
        }
        &.form-row {
          .form-item { display: flex; flex-direction: row; align-items: center;
            .form-label { margin: 0; margin-right: 14px; flex-grow: 0; }
            .form-data  { flex-grow: 1; display: inline-flex; } 
          }
        }
      }


      .data-box {
        line-height: 30px; ;
      }
      /* form-box (켈린더 등..) */
      .dash-box { display: flex; align-items: center;
        >span{ flex-grow: 1; }
        >div { flex:auto; min-width: 80px; }
        >span + span, > span + div , > div + span , > div + div { margin-left: 5px; }
        >.dash + span , >.dash + div { margin-left: 0px; }
        >.dash { flex-grow: 0; display: inline-flex; align-items: center; margin: 0 5px;  text-align: center; }
      }
      /* input + button + 검색 */
      .txt_btn-box { display: flex;  align-items: center;
        input { flex-grow: 1; }
        .btn { flex-grow: 0;  }
        input + .btn, .btn + .btn { margin-left: 10px; }
      }
      /* 라디오, 체크박스 */
      .input-group { display: flex; align-items: center;
        label { margin-right: 0; line-height: 30px; }
      }
      /* input + text-notice */
      .flex-box { display: flex; align-items: center; }

    }
